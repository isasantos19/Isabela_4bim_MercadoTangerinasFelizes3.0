
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="minha_conta.css">
    <title>Minha Conta - Mercado Tangerinas Felizes</title>
</head>

<body>

    <header>
        <h1>Mercado Tangerinas Felizes</h1>

        <nav>
            <a href="../../../../index.html">Início</a>
            <a href="../../../Menu/menu.HTML#lista_produtos">Produtos</a>
            <a href="../../Compras/carrinho/carrinho.HTML">Carrinho</a>
        </nav>
    </header>

    <main>

        <section>

            <h2>Meus dados cadastrais</h2>

            <form id="form_conta">

                <div>
                    <label for="nome_pessoa">Nome:</label>
                    <input type="text" id="nome_pessoa" readonly>
                </div>

                <div>
                    <label for="email_pessoa">E-mail:</label>
                    <input type="email" id="email_pessoa" readonly>
                </div>

                <div>
                    <label for="cpf_cliente">CPF:</label>
                    <input type="text" id="cpf_cliente" readonly>
                </div>

                <div>
                    <label for="telefone_cliente">Telefone:</label>
                    <input type="text" id="telefone_cliente" readonly>
                </div>

                <div>
                    <label for="cep_cliente">CEP:</label>
                    <input type="text" id="cep_cliente" readonly>
                    <button type="button" id="buscar_cep" hidden>Buscar CEP</button>
                </div>

                <div>
                    <label for="rua_cliente">Rua:</label>
                    <input type="text" id="rua_cliente" readonly>
                </div>

                <div>
                    <label for="numero_cliente">Número:</label>
                    <input type="text" id="numero_cliente" readonly>
                </div>

                <div>
                    <label for="complemento_cliente">Complemento:</label>
                    <input type="text" id="complemento_cliente" readonly>
                </div>

                <div>
                    <label for="bairro_cliente">Bairro:</label>
                    <input type="text" id="bairro_cliente" readonly>
                </div>

                <div>
                    <label for="cidade_cliente">Cidade:</label>
                    <input type="text" id="cidade_cliente" readonly>
                </div>

                <div>
                    <label for="estado_cliente">Estado:</label>
                    <input type="text" id="estado_cliente" readonly>
                </div>

                <button type="button" id="editar_dados">Editar dados</button>
                <button type="submit" id="salvar_dados" hidden>Salvar alterações</button>
                <button type="button" id="cancelar_edicao" hidden>Cancelar</button>

                <p id="mensagem_conta"></p>

            </form>

        </section>

    </main>

    <footer>
        <p>Mercado Tangerinas Felizes</p>
    </footer>

    <script src="minha_conta.js"></script>

</body>

</html>
